<?xml version="1.0" encoding="UTF-8"?>
<!-- Example for XML Galaxy: an SVG drawing. Shapes are defined once in <defs> and reused with <use href="#…">,
     so each reuse shows up as a dashed link to its definition. Open the file in a browser to see the picture. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <title>Night sky</title>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <symbol id="star" viewBox="-10 -10 20 20"><polygon points="0,-9 2.6,-2.8 9,-2.8 3.9,1.3 5.6,8 0,4.2 -5.6,8 -3.9,1.3 -9,-2.8 -2.6,-2.8" fill="#e2e8f0"/></symbol>
    <symbol id="planet" viewBox="-20 -20 40 40"><circle r="10" fill="#60a5fa"/><ellipse rx="18" ry="5" fill="none" stroke="#a78bfa" stroke-width="2"/></symbol>
  </defs>
  <rect id="sky" width="400" height="240" fill="#0b1020"/>
  <circle id="sun" cx="60" cy="60" r="28" fill="url(#glow)"/>
  <g id="stars">
    <use href="#star" x="150" y="30" width="14" height="14"/>
    <use href="#star" x="220" y="70" width="10" height="10"/>
    <use href="#star" x="320" y="40" width="16" height="16"/>
    <use href="#star" x="280" y="150" width="12" height="12"/>
    <use href="#star" x="90" y="170" width="10" height="10"/>
  </g>
  <g id="planets">
    <use href="#planet" x="180" y="120" width="60" height="60"/>
    <use href="#planet" x="320" y="180" width="40" height="40"/>
  </g>
  <text x="200" y="228" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Night sky</text>
</svg>
